global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "blackbox-exporter"
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # Blackbox HTTP probes against the three application services.
  # Each target group carries a "service" label so Grafana panels and
  # alert annotations can identify which service is being checked.
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://corporate-website:80/"]
        labels:
          service: corporate-website
      - targets: ["http://asset-api:5000/health"]
        labels:
          service: asset-api
      - targets: ["http://admin-portal:5001/"]
        labels:
          service: admin-portal
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

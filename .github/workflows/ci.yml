name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint asset-api
        run: ruff check services/asset-api

      - name: Lint admin-portal
        run: ruff check services/admin-portal

      - name: Lint ticket-bridge
        run: ruff check services/ticket-bridge

  build-and-test:
    name: Build images & smoke test the stack
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build application images
        run: docker compose build corporate-website asset-api admin-portal ticket-bridge

      - name: Start the stack
        run: docker compose up -d corporate-website asset-db asset-api admin-portal

      # Containers report "healthy" on their own schedule, so poll the actual
      # endpoints instead of trusting a fixed sleep.
      - name: Wait for services to become reachable
        run: |
          timeout 90 bash -c '
            until curl -sf http://localhost:8081/ >/dev/null \
               && curl -sf http://localhost:8082/health >/dev/null \
               && curl -sf http://localhost:8083/ >/dev/null; do
              sleep 3
            done
          '

      # Each check retries for ~25s and prints the actual response before
      # failing. Every curl call is guarded with `|| true`: this step runs
      # under `bash -e`, and a *standalone* command failing (not part of an
      # if/while/&&/|| list) aborts the whole script immediately with curl's
      # own exit code - which is exactly what silently ate our diagnostics
      # the first time this broke (exit 56, "failure receiving network
      # data", with zero "Attempt" lines logged). `|| true` makes sure a
      # network-level failure just leaves $body empty and lets the loop
      # actually run and report each attempt, instead of dying on the first.
      - name: Smoke test corporate-website
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -sf http://localhost:8081/ || true)
            [ -n "$body" ] && exit 0
            echo "Attempt $i: request failed or returned nothing"; sleep 5
          done
          exit 1

      - name: Smoke test asset-api /health
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -s http://localhost:8082/health || true)
            echo "$body" | grep -q '"status":"ok"' && exit 0
            echo "Attempt $i: $body"; sleep 5
          done
          exit 1

      - name: Smoke test asset-api /api/assets
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -s http://localhost:8082/api/assets || true)
            echo "$body" | grep -q 'asset_type' && exit 0
            echo "Attempt $i: $body"; sleep 5
          done
          exit 1

      - name: Smoke test admin-portal
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -s http://localhost:8083/ || true)
            echo "$body" | grep -q 'IT Asset Admin Portal' && exit 0
            echo "Attempt $i: request failed or did not contain expected text"; sleep 5
          done
          exit 1

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

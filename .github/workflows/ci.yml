name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint asset-api
        run: ruff check services/asset-api

      - name: Lint admin-portal
        run: ruff check services/admin-portal

      - name: Lint ticket-bridge
        run: ruff check services/ticket-bridge

  build-and-test:
    name: Build images & smoke test the stack
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build application images
        run: docker compose build corporate-website asset-api admin-portal ticket-bridge

      - name: Start the stack
        run: docker compose up -d corporate-website asset-db asset-api admin-portal

      # Containers report "healthy" on their own schedule, so poll the actual
      # endpoints instead of trusting a fixed sleep.
      - name: Wait for services to become reachable
        run: |
          timeout 90 bash -c '
            until curl -sf http://localhost:8081/ >/dev/null \
               && curl -sf http://localhost:8082/health >/dev/null \
               && curl -sf http://localhost:8083/ >/dev/null; do
              sleep 3
            done
          '

      # Each check retries for ~15s and prints the actual response before
      # failing, since a bare `curl -sf | grep` swallows the response body -
      # a genuine failure would otherwise show nothing but "exit code 1" in
      # the log. CI runners are shared/slower than a local machine, so the
      # asset-api <-> asset-db round trip can flake for a beat even after
      # the "reachable" wait above has already passed once.
      - name: Smoke test corporate-website
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -sf http://localhost:8081/) && exit 0
            echo "Attempt $i: request failed"; sleep 3
          done
          echo "Final response:"; curl -s http://localhost:8081/
          exit 1

      - name: Smoke test asset-api /health
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -s http://localhost:8082/health)
            echo "$body" | grep -q '"status":"ok"' && exit 0
            echo "Attempt $i: $body"; sleep 3
          done
          exit 1

      - name: Smoke test asset-api /api/assets
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -s http://localhost:8082/api/assets)
            echo "$body" | grep -q 'asset_type' && exit 0
            echo "Attempt $i: $body"; sleep 3
          done
          exit 1

      - name: Smoke test admin-portal
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -s http://localhost:8083/)
            echo "$body" | grep -q 'IT Asset Admin Portal' && exit 0
            echo "Attempt $i: request did not contain expected text"; sleep 3
          done
          echo "Final response:"; echo "$body"
          exit 1

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

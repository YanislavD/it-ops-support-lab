services:
  corporate-website:
    build: ./services/corporate-website
    container_name: corporate-website
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - lab

  asset-db:
    image: postgres:16-alpine
    container_name: asset-db
    environment:
      POSTGRES_DB: assets
      POSTGRES_USER: assets_user
      POSTGRES_PASSWORD: assets_pass
    volumes:
      - asset-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assets_user -d assets"]
      interval: 10s
      timeout: 5s
      retries: 5

  asset-api:
    build: ./services/asset-api
    container_name: asset-api
    environment:
      DB_HOST: asset-db
      DB_PORT: 5432
      DB_NAME: assets
      DB_USER: assets_user
      DB_PASSWORD: assets_pass
    ports:
      - "8082:5000"
    depends_on:
      asset-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lab

  admin-portal:
    build: ./services/admin-portal
    container_name: admin-portal
    environment:
      ASSET_API_URL: http://asset-api:5000
    ports:
      - "8083:5001"
    depends_on:
      - asset-api
    restart: unless-stopped
    networks:
      - lab

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    ports:
      - "9115:9115"
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped
    networks:
      - lab

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - blackbox-exporter
    restart: unless-stopped
    networks:
      - lab

  alertmanager-discord:
    image: benjojo/alertmanager-discord:latest
    container_name: alertmanager-discord
    environment:
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK_URL:-}
    restart: unless-stopped
    networks:
      - lab

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - alertmanager-discord
    restart: unless-stopped
    networks:
      - lab

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - lab

  osticket-tls:
    image: alpine/openssl
    container_name: osticket-tls
    entrypoint: sh
    command: >-
      -c "[ -e /ssl/private/key.pem ] ||
      openssl req -x509 -newkey rsa:4096 -keyout /ssl/private/key.pem -out /ssl/cert.pem
      -nodes -sha256 -days 3650 -subj '/C=DE/O=NovaTech/CN=osticket-db'
      && chown -R 999 /ssl"
    volumes:
      - osticket-ssl-public:/ssl
      - osticket-ssl-private:/ssl/private
    networks:
      - lab

  osticket-db:
    image: mariadb:11
    container_name: osticket-db
    command: >-
      --ssl_cert=/var/lib/ssl/cert.pem
      --ssl_key=/var/lib/ssl/private/key.pem
      --ssl_ca=/var/lib/ssl/cert.pem
      --require_secure_transport=1
    depends_on:
      osticket-tls:
        condition: service_completed_successfully
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: osticket
      MARIADB_USER: osticket
      MARIADB_PASSWORD: osticket_pass
    volumes:
      - osticket-db-data:/var/lib/mysql
      - osticket-ssl-public:/var/lib/ssl:ro
      - osticket-ssl-private:/var/lib/ssl/private:ro
    healthcheck:
      test: "/usr/local/bin/healthcheck.sh --su mysql --connect --innodb_initialized"
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - lab

  osticket:
    image: rinkp/osticket-dockerized:main-patches
    container_name: osticket
    depends_on:
      osticket-db:
        condition: service_healthy
    environment:
      OST_SECRET_SALT: ${OSTICKET_SECRET_SALT:-}
      OST_ADMIN_EMAIL: ${OSTICKET_ADMIN_EMAIL:-admin@novatech.example}
      OST_ADMIN_PASSWD: ${OSTICKET_ADMIN_PASSWORD:-changeme123}
      OST_DBTYPE: mysql
      OST_DBHOST: osticket-db
      OST_DBNAME: osticket
      OST_DBUSER: osticket
      OST_DBPASS: osticket_pass
      OST_DBSSLCA: /var/lib/ssl/cert.pem
      OST_TABLE_PREFIX: ost_
      OST_TRUSTED_PROXIES: "127.0.0.1"
      OST_LOCAL_NETWORKS: "127.0.0.0/24"
      OST_SESSION_BACKEND: db
    volumes:
      - osticket-attachments:/var/www/attachments
      - osticket-ssl-public:/var/lib/ssl:ro
    ports:
      - "8084:80"
    restart: on-failure:2
    networks:
      - lab

  ticket-bridge:
    build: ./services/ticket-bridge
    container_name: ticket-bridge
    environment:
      OSTICKET_URL: http://osticket
      OSTICKET_API_KEY: ${OSTICKET_API_KEY:-}
    depends_on:
      - osticket
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: 172.28.0.50

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  asset-db-data:
  prometheus-data:
  grafana-data:
  osticket-db-data:
  osticket-attachments:
  osticket-ssl-public:
  osticket-ssl-private:

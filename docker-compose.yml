services:
  corporate-website:
    build: ./services/corporate-website
    container_name: corporate-website
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - lab

  asset-db:
    image: postgres:16-alpine
    container_name: asset-db
    environment:
      POSTGRES_DB: assets
      POSTGRES_USER: assets_user
      POSTGRES_PASSWORD: assets_pass
    volumes:
      - asset-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assets_user -d assets"]
      interval: 10s
      timeout: 5s
      retries: 5

  asset-api:
    build: ./services/asset-api
    container_name: asset-api
    environment:
      DB_HOST: asset-db
      DB_PORT: 5432
      DB_NAME: assets
      DB_USER: assets_user
      DB_PASSWORD: assets_pass
    ports:
      - "8082:5000"
    depends_on:
      asset-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lab

  admin-portal:
    build: ./services/admin-portal
    container_name: admin-portal
    environment:
      ASSET_API_URL: http://asset-api:5000
    ports:
      - "8083:5001"
    depends_on:
      - asset-api
    restart: unless-stopped
    networks:
      - lab

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    ports:
      - "9115:9115"
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped
    networks:
      - lab

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - blackbox-exporter
    restart: unless-stopped
    networks:
      - lab

  alertmanager-discord:
    image: benjojo/alertmanager-discord:latest
    container_name: alertmanager-discord
    environment:
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK_URL:-}
    restart: unless-stopped
    networks:
      - lab

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - alertmanager-discord
    restart: unless-stopped
    networks:
      - lab

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - lab

networks:
  lab:
    driver: bridge

volumes:
  asset-db-data:
  prometheus-data:
  grafana-data:
